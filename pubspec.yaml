name: zendesk_sdk
description: >-
  A Flutter plugin integrating Zendesk Support, Chat, Answer Bot, and Messaging
  SDKs for Android and iOS.
version: 1.2.0+4

homepage: https://github.com/vishalsharma-hovr/zendesk_sdk
repository: https://github.com/vishalsharma-hovr/zendesk_sdk
issue_tracker: https://github.com/vishalsharma-hovr/zendesk_sdk/issues

environment:
  sdk: ^3.11.0
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.zendesk_sdk
        pluginClass: ZendeskSdkPlugin
      ios:
        pluginClass: ZendeskSdkPlugin
